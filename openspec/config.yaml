schema: spec-driven

context: |
  Project: Kalika Harness Switcher (`khs`), a local control plane for resolving
  profiles and supervising isolated sessions of native AI coding harnesses.
  It must configure and launch existing harnesses without reimplementing their
  agent loops, tools, conversations, or vendor-owned session behavior.

  Tech stack: Go. Initial platforms: Linux and macOS, with future Windows
  support. Priorities, in order: simplicity, low coupling, modularity,
  testability, security, performance, and few external dependencies.

  Profiles describe desired capabilities. Security contexts describe execution
  authority and credential references. Vendor-specific behavior belongs in
  adapters; the resolver and session manager must not contain tool-name
  conditionals. Configuration generated for one session must not mutate another
  session or a user's global shell environment.

  Filesystem paths must always be resolved through Go's native, platform-aware
  APIs for the path's semantic category, such as os.UserConfigDir,
  os.UserCacheDir, os.UserHomeDir, os.TempDir, and filepath operations. Never
  infer a platform path from environment conventions, concatenate path strings,
  or hardcode paths such as ~/.config, ~/.local/state, ~/Library, /tmp, or
  Windows profile directories. When the Go standard library has no native
  resolver for a required semantic category, isolate that decision behind an
  explicit platform-specific resolver with per-OS implementations and tests;
  never leave the path inferred or hardcoded in domain or application code.

  Any behavior that varies by operating system, not only filesystem path
  resolution, must be isolated behind an explicit platform boundary with
  per-OS implementations and tests. Linux and macOS are the initial supported
  platforms; designs must preserve a clean path to future Windows support and
  must not let OS-specific conditionals or assumptions leak into domain or
  application logic.

