schema: spec-driven

context: |
  Kalika Harness Switcher (`khs`) is a local control plane for profiles and
  isolated sessions of native AI coding harnesses. It configures and launches
  those tools without reimplementing their behavior.

  Stack: Go. Platforms: Linux and macOS initially, Windows later. Priorities:
  simplicity, low coupling, modularity, testability, security, performance,
  and few dependencies.

  Profiles define capabilities; security contexts define authority and
  credential references. Vendor logic belongs in adapters. Sessions must not
  mutate each other or the user's global environment.

rules:
  proposal:
    - Identify OS-specific behavior and its platform boundary for Linux and
      macOS while preserving future Windows support.
  tasks:
    - For filesystem paths, require `filepath` and the appropriate native Go
      resolver. If none exists, require a tested per-OS resolver. Never infer,
      concatenate, or hardcode platform paths.
