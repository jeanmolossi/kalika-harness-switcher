schema: spec-driven

context: |
  Project: Kalika Harness Switcher (`khs`), a local control plane for resolving
  profiles and supervising isolated sessions of native AI coding harnesses.
  It must configure and launch existing harnesses without reimplementing their
  agent loops, tools, conversations, or vendor-owned session behavior.

  Tech stack: Go. Initial platforms: Linux and macOS, with future Windows
  support. Priorities, in order: simplicity, low coupling, modularity,
  testability, security, performance, and few external dependencies.

  Profiles describe desired capabilities. Security contexts describe execution
  authority and credential references. Vendor-specific behavior belongs in
  adapters; the resolver and session manager must not contain tool-name
  conditionals. Configuration generated for one session must not mutate another
  session or a user's global shell environment.

rules:
  proposal:
    - Explicitly identify every behavior that varies by operating system and
      state that it must be isolated behind a platform boundary. Proposals must
      cover Linux and macOS as the initial targets and explain how the change
      preserves future Windows support without leaking OS-specific assumptions
      into domain or application logic.
  tasks:
    - Every task that creates, resolves, joins, compares, or persists a
      filesystem path must explicitly require Go's `filepath` package and the
      native semantic resolver appropriate to the path, such as
      `os.UserConfigDir`, `os.UserCacheDir`, `os.UserHomeDir`, or `os.TempDir`.
      Tasks must forbid inferred environment conventions, string-concatenated
      paths, and hardcoded Linux, macOS, or Windows directories.
    - When the Go standard library has no native resolver for a required path
      category, the applicable task must explicitly require a platform-specific
      resolver with per-OS implementations and tests for supported platforms,
      while preserving an implementation boundary for future Windows support.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
